# Reverse proxy for the healthcare voice agent. Terminates TLS (via certbot) and forwards
# HTTP + WebSocket traffic to the Node app on localhost:3000. WebRTC's actual audio (UDP RTP)
# does NOT go through nginx — it goes directly to the app process on the ICE port range,
# which is why the firewall needs that UDP range opened separately (see DEPLOY.md).
#
# Copy to /etc/nginx/sites-available/healthcare-voice-agent, symlink into sites-enabled,
# then run `sudo certbot --nginx -d your-domain.com` to fill in the TLS block automatically.

server {
    listen 80;
    server_name your-domain.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Required for the /rtc-signal WebSocket upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket connections are long-lived; don't let nginx time them out early.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
