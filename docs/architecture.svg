<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="660" fill="#ffffff"/>
  <rect x="1" y="1" width="1278" height="658" rx="18" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <text x="640" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Real-Time Voice Agent — System Architecture</text>
  <text x="640" y="64" text-anchor="middle" font-size="13" fill="#64748b">WebRTC audio in/out · streaming speech-to-text and text-to-speech · sentence-level safety-checked LLM pipeline</text>

  <!-- ============ MAIN PIPELINE ROW (box width 110, gap 50, start x 25) ============ -->
  <g stroke="#64748b" stroke-width="1.5" fill="none">
    <line x1="135" y1="165" x2="185" y2="165" marker-end="url(#arrowSlate)"/>
    <line x1="295" y1="165" x2="345" y2="165" marker-end="url(#arrowSlate)"/>
    <line x1="455" y1="165" x2="505" y2="165" marker-end="url(#arrowSlate)"/>
    <line x1="615" y1="165" x2="665" y2="165" marker-end="url(#arrowSlate)"/>
    <line x1="775" y1="165" x2="825" y2="165" marker-end="url(#arrowSlate)"/>
    <line x1="935" y1="165" x2="985" y2="165" marker-end="url(#arrowSlate)"/>
    <line x1="1095" y1="165" x2="1145" y2="165" marker-end="url(#arrowSlate)"/>
  </g>
  <g font-size="9.5" fill="#475569" text-anchor="middle">
    <text x="160" y="150">mic audio</text>
    <text x="160" y="161">(WebRTC)</text>
    <text x="320" y="155">PCM</text>
    <text x="480" y="150">transcript</text>
    <text x="480" y="161">+ barge-in</text>
    <text x="640" y="155">safe text</text>
    <text x="800" y="150">streamed</text>
    <text x="800" y="161">sentences</text>
    <text x="960" y="150">safe</text>
    <text x="960" y="161">sentence</text>
    <text x="1120" y="150">audio</text>
    <text x="1120" y="161">(WS)</text>
  </g>

  <!-- Client: Mic -->
  <g filter="url(#cardShadow)">
    <rect x="25" y="120" width="110" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  </g>
  <text x="80" y="148" text-anchor="middle" font-size="20">🎤</text>
  <text x="80" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Microphone</text>
  <text x="80" y="186" text-anchor="middle" font-size="10" fill="#3b5998">getUserMedia</text>

  <!-- Server: WebRTC session -->
  <g filter="url(#cardShadow)">
    <rect x="185" y="120" width="110" height="90" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="240" y="145" text-anchor="middle" font-size="17">🔗</text>
  <text x="240" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">WebRTC</text>
  <text x="240" y="178" text-anchor="middle" font-size="9.5" fill="#475569">werift</text>
  <text x="240" y="191" text-anchor="middle" font-size="9.5" fill="#475569">Opus decode</text>

  <!-- External: Deepgram STT -->
  <g filter="url(#cardShadow)">
    <rect x="345" y="120" width="110" height="90" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  </g>
  <text x="400" y="145" text-anchor="middle" font-size="17">📝</text>
  <text x="400" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Deepgram STT</text>
  <text x="400" y="178" text-anchor="middle" font-size="9.5" fill="#5b21b6">Nova-3</text>
  <text x="400" y="191" text-anchor="middle" font-size="9.5" fill="#5b21b6">real-time</text>

  <!-- Server: Safety Filter (input) -->
  <g filter="url(#cardShadow)">
    <rect x="505" y="120" width="110" height="90" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="560" y="145" text-anchor="middle" font-size="17">🛡️</text>
  <text x="560" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Safety Filter</text>
  <text x="560" y="178" text-anchor="middle" font-size="9.5" fill="#475569">input: emergency /</text>
  <text x="560" y="191" text-anchor="middle" font-size="9.5" fill="#475569">prescribing</text>

  <!-- External: Claude -->
  <g filter="url(#cardShadow)">
    <rect x="665" y="120" width="110" height="90" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  </g>
  <text x="720" y="145" text-anchor="middle" font-size="17">🧠</text>
  <text x="720" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Claude</text>
  <text x="720" y="178" text-anchor="middle" font-size="9.5" fill="#5b21b6">Haiku 4.5</text>
  <text x="720" y="191" text-anchor="middle" font-size="9.5" fill="#5b21b6">sentence stream</text>

  <!-- Server: Safety Filter (output) -->
  <g filter="url(#cardShadow)">
    <rect x="825" y="120" width="110" height="90" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="880" y="145" text-anchor="middle" font-size="17">🛡️</text>
  <text x="880" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Safety Filter</text>
  <text x="880" y="178" text-anchor="middle" font-size="9.5" fill="#475569">per sentence:</text>
  <text x="880" y="191" text-anchor="middle" font-size="9.5" fill="#475569">misinfo / dosage</text>

  <!-- External: Deepgram TTS -->
  <g filter="url(#cardShadow)">
    <rect x="985" y="120" width="110" height="90" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  </g>
  <text x="1040" y="145" text-anchor="middle" font-size="17">🗣️</text>
  <text x="1040" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Deepgram TTS</text>
  <text x="1040" y="178" text-anchor="middle" font-size="9.5" fill="#5b21b6">Aura voices</text>
  <text x="1040" y="191" text-anchor="middle" font-size="9.5" fill="#5b21b6">streaming PCM</text>

  <!-- Client: Speaker -->
  <g filter="url(#cardShadow)">
    <rect x="1145" y="120" width="110" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  </g>
  <text x="1200" y="148" text-anchor="middle" font-size="20">🔊</text>
  <text x="1200" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Web Audio</text>
  <text x="1200" y="186" text-anchor="middle" font-size="10" fill="#3b5998">speaker output</text>

  <!-- ============ SESSION STORE ============ -->
  <g stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5,4" fill="none">
    <path d="M 560 210 C 560 250, 610 250, 630 275"/>
    <path d="M 880 210 C 880 250, 830 250, 810 275"/>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="625" y="278" width="190" height="66" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="720" y="300" text-anchor="middle" font-size="16">🗄️</text>
  <text x="720" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">SQLite</text>
  <text x="720" y="333" text-anchor="middle" font-size="9.5" fill="#475569">session + transcript history</text>

  <!-- ============ BARGE-IN INTERRUPT PATH ============ -->
  <path d="M 400 210 C 400 420, 1200 420, 1200 210" stroke="#d97706" stroke-width="1.6" stroke-dasharray="7,5" fill="none" marker-end="url(#arrowAmber)"/>
  <g filter="url(#cardShadow)">
    <rect x="555" y="405" width="290" height="36" rx="8" fill="#f8fafc" stroke="#d97706" stroke-width="1.3"/>
  </g>
  <text x="700" y="420" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">barge-in: user starts talking</text>
  <text x="700" y="433" text-anchor="middle" font-size="10" fill="#92400e">stops playback instantly (generation++)</text>

  <!-- ============ LEGEND ============ -->
  <g font-size="11.5" fill="#334155">
    <rect x="40" y="580" width="16" height="16" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <text x="64" y="592">Browser (client)</text>

    <rect x="230" y="580" width="16" height="16" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
    <text x="254" y="592">Node.js application server</text>

    <rect x="470" y="580" width="16" height="16" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="494" y="592">External AI API</text>

    <line x1="660" y1="588" x2="700" y2="588" stroke="#d97706" stroke-width="1.6" stroke-dasharray="7,5"/>
    <text x="708" y="592">Interrupt / control signal</text>
  </g>

  <text x="640" y="635" text-anchor="middle" font-size="10.5" fill="#94a3b8">One WebSocket connection carries both the JSON control channel and the binary TTS audio channel; mic audio travels separately over WebRTC/UDP.</text>
</svg>
